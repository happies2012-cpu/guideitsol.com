name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SITE_URL: https://www.guideitsol.com
          VITE_FIREBASE_API_KEY: AIzaSyBRe-nty0yKXn44bnw2CoMugsoHg3omTY0
          VITE_FIREBASE_AUTH_DOMAIN: gsgroups-71fb9.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: gsgroups-71fb9
          VITE_FIREBASE_STORAGE_BUCKET: gsgroups-71fb9.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 801891170745
          VITE_FIREBASE_APP_ID: 1:801891170745:web:fcd8a73b0374a0099d1e68
          VITE_PAYU_MERCHANT_KEY: eBVOls
          VITE_PAYU_PAYMENT_URL: https://secure.payu.in/_payment
          VITE_UPI_ID: 8884162999-4@ybl
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
