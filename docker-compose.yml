version: '3.8'

services:
  # ============================================
  # GuideIT Solutions - Main Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guidesoft-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/database.db}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - PAYU_MERCHANT_KEY=${PAYU_MERCHANT_KEY:-}
      - PAYU_MERCHANT_SALT=${PAYU_MERCHANT_SALT:-}
      - PAYU_BASE_URL=${PAYU_BASE_URL:-https://secure.payu.in/_payment}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - VITE_SITE_URL=${VITE_SITE_URL:-http://localhost:3000}
    volumes:
      # Persist database
      - guidesoft-data:/app/data
      # Optional: Mount logs directory
      - guidesoft-logs:/app/logs
    networks:
      - guidesoft-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.dokploy.project=guidesoft"
      - "com.dokploy.service=app"

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: guidesoft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - guidesoft-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.dokploy.project=guidesoft"
      - "com.dokploy.service=redis"

# ============================================
# Named Volumes
# ============================================
volumes:
  guidesoft-data:
    driver: local
    name: guidesoft-data
  guidesoft-logs:
    driver: local
    name: guidesoft-logs
  redis-data:
    driver: local
    name: redis-data

# ============================================
# Networks
# ============================================
networks:
  guidesoft-network:
    driver: bridge
    name: guidesoft-network
